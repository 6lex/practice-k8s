apiVersion: v1
kind: Pod
metadata:
  name: demo-liveness-restart
  labels:
    test: liveness
spec:
  containers:
  - name: liveness-container
    image: busybox
    args:
    - /bin/sh
    - -c
    - touch /tmp/healthy; sleep 30; rm -rf /tmp/healthy; sleep 600                                            
    livenessProbe:
      exec:
        command:
        - cat
        - /tmp/healthy
      initialDelaySeconds: 5  # Attend 5s avant de commencer
      periodSeconds: 5       # Vérifie toutes les 5s
