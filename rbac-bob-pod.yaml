apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bob-pod-reader
  namespace: rbac
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bob-pod-reader
  namespace: rbac
subjects:
  - kind: User
    name: bob
roleRef:
  kind: Role
  name: bob-pod-reader
  apiGroup: rbac.authorization.k8s.io
