apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubia-route
  namespace: default
spec:
  parentRefs:
  - name: prod-gateway
  hostnames:
  - "kubia.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /kubia
    backendRefs:
    - name: kubia-nodeport
      port: 80
