apiVersion: v1
kind: Pod
metadata:
  name: git-init-demo
spec:
  volumes:
    - name: shared-data
      emptyDir: {}

  initContainers:
    - name: git-cloner
      image: alpine/git
      command:
        - sh
        - -c
        - git clone https://github.com/mdn/beginner-html-site.git /data
      volumeMounts:
        - name: shared-data
          mountPath: /data

  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
          protocol: TCP
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
          readOnly: true